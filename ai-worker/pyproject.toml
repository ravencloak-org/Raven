[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "raven-worker"
version = "0.3.0"
description = "Raven AI Worker - gRPC service for document parsing, embedding, and RAG"
requires-python = ">=3.12"
dependencies = [
    "grpcio>=1.69.0",
    "grpcio-reflection>=1.69.0",
    "grpcio-health-checking>=1.69.0",
    "protobuf>=6.33.5",
    "pydantic-settings>=2.7.0",
    "structlog>=24.4.0",
    "opentelemetry-api>=1.29.0",
    "opentelemetry-sdk>=1.29.0",
    "opentelemetry-exporter-otlp>=1.29.0",
    "opentelemetry-instrumentation-grpc>=0.50b0",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "langchain-text-splitters>=0.3.0",
    "openai>=1.0.0",
    # Cohere 7.x is a major SDK rewrite. Holding to <7 until ai-worker code is
    # audited against the v7 migration guide. Tracked in Dependabot #704.
    "cohere>=5.0.0,<8",
    # Cohere 6.x pins pydantic-core<2.44.0; without these constraints pip
    # resolves pydantic 2.13.x which needs pydantic-core 2.46.x, breaking the
    # resolve. Tied to the cohere<7 hold above.
    "pydantic<2.13",
    "pydantic-core<2.44",
    "asyncpg>=0.30.0",
    "tenacity>=9.0.0",
    "cryptography>=42.0.0",
    "anthropic>=0.40.0",
    # redis-py 8.0 changes async client and connection-pool semantics; holding
    # to <8 until the worker's redis usage (cache + Asynq broker reads) is
    # audited against the v8 migration notes.
    "redis>=5.0.0,<8",
    "livekit>=1.0.0",
    # livekit-agents 1.3.x has Requires-Python <3.14, which conflicts with the
    # Python 3.14 base image (Dockerfile). The 1.5.x line lifted that to <3.15.
    # Re-evaluate when 1.6 ships.
    "livekit-agents>=1.5.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
]

[project.optional-dependencies]
dev = [
    "grpcio-tools>=1.69.0",
    "mypy>=1.13.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=6.0.0",
    "respx>=0.21.1",
    "ruff>=0.9.0",
]

[tool.setuptools.packages.find]
include = ["raven_worker*"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["raven_worker/generated"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "A", "SIM"]

[tool.ruff.lint.per-file-ignores]
"raven_worker/server.py" = ["N802"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
exclude = ["raven_worker/generated/.*"]

[[tool.mypy.overrides]]
module = "raven_worker.server"
ignore_errors = true

[tool.coverage.run]
source = ["raven_worker"]
omit = ["raven_worker/generated/*"]

[tool.coverage.report]
show_missing = true
fail_under = 70

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "fakeredis>=2.35.1",
]
