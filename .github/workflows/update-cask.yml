name: Update Homebrew Cask after release

# Runs every time a Raven AI release is published. Downloads the .dmg,
# computes the SHA-256, and opens a PR that bumps the version and hash in
# Casks/raven-ai.rb. The next time someone runs `brew install --cask
# ravencloak-org/Raven/raven-ai` they get the new bits.

on:
  # The release-publish path is kept as the natural trigger when a human
  # cuts a release manually. desktop-release.yml's manifest job uses
  # workflow_dispatch instead, because GHA does NOT fire `release:
  # published` for releases authored by github-actions[bot] using the
  # default GITHUB_TOKEN (anti-loop protection).
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to bump (e.g. raven-ai-v0.1.6). Leave blank to pick the latest published raven-ai-v* release.'
        required: false
        default: ''

permissions:
  contents: write
  pull-requests: write

jobs:
  bump-cask:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Resolve target tag
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          if [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          elif [ -n "$RELEASE_TAG" ]; then
            TAG="$RELEASE_TAG"
          else
            # workflow_dispatch with no input - pick the most recent
            # raven-ai-v* release that isn't a draft.
            TAG=$(gh release list --limit 30 --json tagName,isDraft \
              --jq '[.[] | select(.tagName | startswith("raven-ai-v")) | select(.isDraft | not) | .tagName][0] // empty')
          fi
          if [ -z "$TAG" ] || ! echo "$TAG" | grep -qE '^raven-ai-v[0-9]+\.[0-9]+\.[0-9]+'; then
            echo "ERROR: could not resolve a raven-ai-v* tag to bump (got: '$TAG')" >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Resolved tag: $TAG"

      - name: Compute new version + sha256
        id: dmg
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          VERSION="${TAG#raven-ai-v}"
          # GitHub Releases normalises spaces in asset filenames to dots,
          # so the download URL uses "Raven.AI_*" rather than the on-disk
          # "Raven AI_*". Don't URL-encode — the asset *name* itself has
          # the dot.
          FILE="Raven.AI_${VERSION}_universal.dmg"
          URL="https://github.com/${{ github.repository }}/releases/download/${TAG}/${FILE}"
          echo "Downloading $URL"
          curl -fsSL -o raven-ai.dmg "$URL"
          SHA=$(shasum -a 256 raven-ai.dmg | awk '{print $1}')
          rm raven-ai.dmg
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Update Casks/raven-ai.rb
        env:
          VERSION: ${{ steps.dmg.outputs.version }}
          SHA: ${{ steps.dmg.outputs.sha }}
        run: |
          set -euo pipefail
          sed -i -E "s/^  version \".*\"/  version \"${VERSION}\"/" Casks/raven-ai.rb
          sed -i -E "s/^  sha256 \".*\"/  sha256 \"${SHA}\"/" Casks/raven-ai.rb
          grep -E '^  (version|sha256)' Casks/raven-ai.rb

      - name: Open PR
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          title: "chore(cask): bump raven-ai to ${{ steps.dmg.outputs.version }}"
          commit-message: |
            chore(cask): bump raven-ai to ${{ steps.dmg.outputs.version }}

            Auto-generated by .github/workflows/update-cask.yml after the
            release was published. Verified the DMG downloads and updated
            the version + sha256 in Casks/raven-ai.rb.

            Signed-off-by: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          branch: cask/bump-${{ steps.dmg.outputs.version }}
          base: main
          body: |
            Auto-bump from the release pipeline.

            - Tag: `${{ steps.resolve.outputs.tag }}`
            - sha256: `${{ steps.dmg.outputs.sha }}`

            Once merged, users can `brew install --cask ravencloak-org/Raven/raven-ai`
            (after a one-time `brew tap ravencloak-org/Raven https://github.com/ravencloak-org/Raven.git`).
          delete-branch: true
          sign-commits: true
