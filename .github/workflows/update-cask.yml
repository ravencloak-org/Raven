name: Update Homebrew Cask after release

# Runs every time a Raven Local release is published. Downloads the .dmg,
# computes the SHA-256, and opens a PR that bumps the version and hash in
# Casks/raven-local.rb. The next time someone runs `brew install --cask
# ravencloak-org/Raven/raven-local` they get the new bits.

on:
  release:
    types: [published]

permissions:
  contents: write
  pull-requests: write

jobs:
  bump-cask:
    if: startsWith(github.event.release.tag_name, 'raven-local-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Compute new version + sha256
        id: dmg
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#raven-local-v}"
          FILE="Raven%20Local_${VERSION}_universal.dmg"
          URL="https://github.com/${{ github.repository }}/releases/download/${TAG}/${FILE}"
          echo "Downloading $URL"
          curl -fsSL -o raven-local.dmg "$URL"
          SHA=$(shasum -a 256 raven-local.dmg | awk '{print $1}')
          rm raven-local.dmg
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Update Casks/raven-local.rb
        env:
          VERSION: ${{ steps.dmg.outputs.version }}
          SHA: ${{ steps.dmg.outputs.sha }}
        run: |
          set -euo pipefail
          sed -i -E "s/^  version \".*\"/  version \"${VERSION}\"/" Casks/raven-local.rb
          sed -i -E "s/^  sha256 \".*\"/  sha256 \"${SHA}\"/" Casks/raven-local.rb
          grep -E '^  (version|sha256)' Casks/raven-local.rb

      - name: Open PR
        uses: peter-evans/create-pull-request@67ccf781d68cd99b580ae25a5c18a1cc84ffff1f # v7.0.6
        with:
          title: "chore(cask): bump raven-local to ${{ steps.dmg.outputs.version }}"
          commit-message: |
            chore(cask): bump raven-local to ${{ steps.dmg.outputs.version }}

            Auto-generated by .github/workflows/update-cask.yml after the
            release was published. Verified the DMG downloads and updated
            the version + sha256 in Casks/raven-local.rb.

            Signed-off-by: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          branch: cask/bump-${{ steps.dmg.outputs.version }}
          base: main
          body: |
            Auto-bump from the release pipeline.

            - Tag: `${{ github.event.release.tag_name }}`
            - sha256: `${{ steps.dmg.outputs.sha }}`

            Once merged, users can `brew install --cask ravencloak-org/Raven/raven-local`
            (after a one-time `brew tap ravencloak-org/Raven https://github.com/ravencloak-org/Raven.git`).
          delete-branch: true
          sign-commits: true
