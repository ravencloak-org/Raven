name: Docs

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "docs-site/**"
      - "contracts/**"
      - "CHANGELOG.md"
      - "CONTRIBUTING.md"
      - "SECURITY.md"
      - "CODE_OF_CONDUCT.md"
      - "GOVERNANCE.md"
      - "MAINTAINERS.md"
      - "README.md"
      - ".github/workflows/docs.yml"
  pull_request:
    branches: [main]
    paths:
      - "docs/**"
      - "docs-site/**"
      - "contracts/**"
      - "CHANGELOG.md"
      - "CONTRIBUTING.md"
      - "SECURITY.md"
      - "CODE_OF_CONDUCT.md"
      - "GOVERNANCE.md"
      - "MAINTAINERS.md"
      - "README.md"
      - ".github/workflows/docs.yml"

permissions: {}

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      deployments: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: docs-site/package-lock.json

      - name: Lint OpenAPI spec
        run: |
          npx -y @stoplight/spectral-cli@6 lint \
            contracts/openapi.yaml \
            --ruleset contracts/.spectral.yaml \
            --fail-severity=error

      - name: Install dependencies
        working-directory: docs-site
        run: npm ci

      - name: Build site
        working-directory: docs-site
        run: npm run build

      - name: Deploy to Cloudflare Pages
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          # Pass user-controlled branch name through env to avoid the
          # script-injection risk of inlining it into the shell script.
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
        # Skip silently on forks / PRs where the secret isn't exposed,
        # mirroring the pattern in landing.yml so external contributors
        # don't see a hard CI failure.
        if: env.CLOUDFLARE_API_TOKEN != ''
        working-directory: docs-site
        run: |
          set -o pipefail
          npx wrangler@4 pages deploy .vitepress/dist \
            --project-name=raven-docs \
            --branch="$BRANCH_NAME" \
            | tee wrangler.out
          # Cloudflare may auto-suffix the project subdomain (e.g.
          # `raven-docs-28s.pages.dev`) when the bare name is already
          # taken globally; allow the optional suffix in the regex.
          url=$(grep -oE 'https://[a-z0-9-]+\.raven-docs(-[a-z0-9]+)?\.pages\.dev' wrangler.out | head -1)
          if [ -z "$url" ]; then
            echo "::error::Could not parse preview URL from wrangler output"
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Comment preview URL on PR
        if: github.event_name == 'pull_request' && steps.deploy.outputs.url != ''
        uses: marocchino/sticky-pull-request-comment@0ea0beb66eb9baf113663a64ec522f60e49231c0  # v3.0.4
        with:
          header: docs-preview
          message: |
            📚 Docs preview: ${{ steps.deploy.outputs.url }}

            Built from `${{ github.sha }}`. Updated automatically on every push to this PR.
