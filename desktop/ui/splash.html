<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Raven AI</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      background: #0f1117;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, sans-serif;
      user-select: none;
    }

    .logo {
      width: 80px;
      height: 80px;
      margin-bottom: 24px;
      border-radius: 16px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
    }

    h1 {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 8px;
      background: linear-gradient(135deg, #6366f1, #a78bfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .subtitle {
      font-size: 14px;
      color: #64748b;
      margin-bottom: 40px;
    }

    /* CSS spinner */
    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid #1e293b;
      border-top-color: #6366f1;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .status {
      margin-top: 16px;
      font-size: 12px;
      color: #475569;
    }

    /* ── Update banner ─────────────────────────────────────────────────── */
    #update-banner {
      display: none;
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #1e293b;
      border-top: 1px solid #334155;
      padding: 12px 20px;
      flex-direction: row;
      align-items: center;
      gap: 12px;
      font-size: 13px;
      color: #94a3b8;
      z-index: 9999;
    }

    #update-banner.visible {
      display: flex;
    }

    #update-banner .update-icon {
      font-size: 18px;
      flex-shrink: 0;
    }

    #update-banner .update-text {
      flex: 1;
    }

    #update-banner .update-text strong {
      color: #e2e8f0;
      display: block;
      margin-bottom: 2px;
    }

    #update-restart-btn {
      background: #6366f1;
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 7px 14px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.15s;
    }

    #update-restart-btn:hover {
      background: #4f46e5;
    }

    #update-dismiss-btn {
      background: transparent;
      color: #64748b;
      border: none;
      padding: 4px 8px;
      font-size: 18px;
      cursor: pointer;
      line-height: 1;
    }

    #update-dismiss-btn:hover {
      color: #94a3b8;
    }
  </style>
</head>
<body>
  <div class="logo">🦅</div>
  <h1>Raven AI</h1>
  <p class="subtitle">Starting…</p>
  <div class="spinner"></div>
  <p class="status" id="status">Waiting for local stack…</p>

  <!-- Update available banner — hidden until updater:available event fires -->
  <div id="update-banner" role="status" aria-live="polite">
    <span class="update-icon" aria-hidden="true">🔄</span>
    <div class="update-text">
      <strong id="update-version">Update available</strong>
      <span id="update-notes"></span>
    </div>
    <button id="update-restart-btn" type="button">Restart to apply</button>
    <button id="update-dismiss-btn" type="button" aria-label="Dismiss update notification">✕</button>
  </div>

  <script>
    // TODO(#418): replace timer with compose health-check event from the
    // orchestrator once the compose lifecycle integration lands.
    const RAVEN_API_URL = "http://127.0.0.1:8081/";
    // Temporary fallback delay: 3s gives users a brief startup transition
    // while local services initialize, and avoids an abrupt redirect flash.
    // Remove this once health-check driven navigation is implemented.
    const SPLASH_DURATION_MS = 3000;
    const RETRY_INTERVAL_MS = 1000;
    const MAX_WAIT_MS = 30000;

    async function isApiReady() {
      try {
        const response = await fetch(RAVEN_API_URL, {
          method: "HEAD",
          cache: "no-store",
        });
        return response.ok;
      } catch (_) {
        return false;
      }
    }

    async function waitForApiAndRedirect() {
      const statusEl = document.getElementById("status");
      const startedAt = Date.now();

      while (Date.now() - startedAt < MAX_WAIT_MS) {
        statusEl.textContent = "Connecting to Raven API…";

        if (await isApiReady()) {
          window.location.href = RAVEN_API_URL;
          return;
        }

        statusEl.textContent = "Raven API is still starting… retrying.";
        await new Promise((resolve) => setTimeout(resolve, RETRY_INTERVAL_MS));
      }

      statusEl.textContent = "Raven API is taking longer than expected. Please check your local stack and restart the app.";
      return;
    }

    setTimeout(waitForApiAndRedirect, SPLASH_DURATION_MS);

    // ── Tauri auto-update banner ───────────────────────────────────────────
    // Tauri's JS API is injected by the webview; guard against plain-browser
    // previews where `window.__TAURI__` is absent.
    (async function initUpdaterBanner() {
      if (typeof window.__TAURI__ === "undefined") return;

      const { listen } = window.__TAURI__.event;
      const { invoke } = window.__TAURI__.core;

      const banner      = document.getElementById("update-banner");
      const versionEl   = document.getElementById("update-version");
      const notesEl     = document.getElementById("update-notes");
      const restartBtn  = document.getElementById("update-restart-btn");
      const dismissBtn  = document.getElementById("update-dismiss-btn");

      let installing = false;

      // Show banner when backend emits "updater:available".
      await listen("updater:available", (event) => {
        const { version, notes } = event.payload || {};
        versionEl.textContent = version
          ? `Update available — v${version}`
          : "Update available";
        notesEl.textContent = notes ? notes.slice(0, 120) : "";
        banner.classList.add("visible");
      });

      // Listen for non-fatal errors (offline, bad sig, etc.).
      await listen("updater:error", (event) => {
        // Errors are intentionally silent in the UI — the app must not be
        // blocked. Log to console for developers.
        console.warn("[updater] update error:", event.payload?.message);
      });

      // "Restart to apply" — triggers download → verify → install → restart.
      restartBtn.addEventListener("click", async () => {
        if (installing) return;
        installing = true;
        restartBtn.textContent = "Downloading…";
        restartBtn.disabled = true;
        try {
          // This call returns only if download/install fails; on success the
          // app restarts immediately.
          await invoke("updater_install_and_restart");
        } catch (err) {
          console.error("[updater] install failed:", err);
          restartBtn.textContent = "Retry";
          restartBtn.disabled = false;
          installing = false;
        }
      });

      // Dismiss hides the banner for this session; the next launch will show
      // it again if the update is still pending (or a newer one is found).
      dismissBtn.addEventListener("click", () => {
        banner.classList.remove("visible");
      });
    })();
    // ── end update banner ──────────────────────────────────────────────────
  </script>
</body>
</html>
