[package]
name = "raven-ai"
version = "0.1.0"
description = "Raven AI — native desktop wrapper for the Raven stack"
authors = []
license = "MIT"
repository = "https://github.com/ravencloak-org/Raven"
edition = "2021"
rust-version = "1.77"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "raven_ai_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "raven-ai"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-shell = "2"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
sysinfo = { version = "0.32", default-features = false, features = ["disk", "system"] }
thiserror = "1"
futures-util = "0.3"
tokio-util = { version = "0.7", features = ["io"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }

[profile.release]
panic = "abort"   # strip expensive panic clean-up code
codegen-units = 1 # allows LLVM to perform better optimization
lto = true        # enables link-time optimization
opt-level = "s"   # optimize for binary size
strip = true      # automatically strip symbols from the binary
